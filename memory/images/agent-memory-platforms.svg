<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agent memory platform evaluation</title>
  <desc id="desc">A technical diagram showing AI agents moving through remember, retrieve, update or delete, and govern stages, with persistent memory backed by database, vector, graph, and managed storage options.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#263442"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f2b8ae"/>
    </marker>
    <style>
      .title { font: 700 35px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #fff; }
      .label { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #fff; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #dbe3eb; }
      .micro { font: 700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f2b8ae; letter-spacing: 1.3px; }
      .box { fill: #202b35; stroke: #617181; stroke-width: 1.5; }
      .accent { fill: #c74634; stroke: #ee8d80; stroke-width: 1.5; }
      .flow { fill: none; stroke: #f2b8ae; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="5" r="245" fill="#c74634" opacity=".09"/>
  <circle cx="65" cy="670" r="250" fill="#58a6ff" opacity=".06"/>

  <text x="58" y="62" class="micro">ORACLE AI DATABASE · AGENT MEMORY</text>
  <text x="58" y="108" class="title">Choose memory by lifecycle, retrieval, and governance</text>

  <g filter="url(#shadow)">
    <rect x="58" y="170" width="214" height="126" rx="18" class="box"/>
    <text x="84" y="211" class="micro">01</text>
    <text x="84" y="246" class="label">Remember</text>
    <text x="84" y="274" class="small">Messages · facts · events</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="170" width="214" height="126" rx="18" class="box"/>
    <text x="376" y="211" class="micro">02</text>
    <text x="376" y="246" class="label">Retrieve</text>
    <text x="376" y="274" class="small">Vector · keyword · graph</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="642" y="170" width="214" height="126" rx="18" class="box"/>
    <text x="668" y="211" class="micro">03</text>
    <text x="668" y="246" class="label">Update or delete</text>
    <text x="668" y="274" class="small">Consolidate · expire · forget</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="934" y="170" width="214" height="126" rx="18" class="accent"/>
    <text x="960" y="211" class="micro" style="fill:#fff">04</text>
    <text x="960" y="246" class="label">Govern</text>
    <text x="960" y="274" class="small" style="fill:#fff">Scope · authorize · audit</text>
  </g>

  <path d="M272 233 L338 233" class="flow"/>
  <path d="M564 233 L630 233" class="flow"/>
  <path d="M856 233 L922 233" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M260 408 h680 v112 c0 42-152 72-340 72s-340-30-340-72z" class="box"/>
    <ellipse cx="600" cy="408" rx="340" ry="66" fill="#31404e" stroke="#7b8c9b" stroke-width="1.5"/>
    <text x="457" y="403" class="label" style="font-size:25px">Persistent agent memory</text>
    <text x="385" y="438" class="small">database · vector store · knowledge graph · managed service</text>
    <text x="386" y="498" class="small">User, agent, and thread scope</text>
    <text x="386" y="530" class="small">Short-term context + durable long-term memories</text>
    <text x="386" y="562" class="small">Lifecycle controls are as important as retrieval quality</text>
  </g>

  <path d="M165 296 C165 358 282 362 355 393" class="flow"/>
  <path d="M457 296 C457 349 493 359 530 381" class="flow"/>
  <path d="M749 296 C749 349 712 359 674 381" class="flow"/>
  <path d="M1041 296 C1041 358 924 362 846 393" class="flow"/>

  <text x="58" y="638" class="small">Compare the full operating model, not only semantic search.</text>
</svg>

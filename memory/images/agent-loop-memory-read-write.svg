<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Agent loop with Oracle AI Database memory read and write paths</title>
  <desc id="description">An iterative agent assembles context, invokes a language model, and observes or acts. Domain context and context engineering feed context assembly. Oracle AI Database supplies memory before reasoning and receives selected outcomes afterward. Human controls, observability, sandboxing, and tool calls surround the loop.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#40545b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#648d3b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#23747b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18323b" flood-opacity=".14"/>
    </filter>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d3037; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .small { font-size: 21px; }
      .body { font-size: 24px; }
      .head { font-size: 25px; font-weight: 750; fill: #fff; }
      .group { font-size: 25px; font-weight: 750; fill: #fff; }
      .dash { fill: none; stroke: #7c8b91; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f2"/>
  <rect x="382" y="180" width="898" height="610" rx="28" fill="#fff3f0" stroke="#c56b5d" stroke-width="3" stroke-dasharray="13 10"/>
  <text x="420" y="755" class="label" font-size="24" font-weight="800" fill="#aa493b">AGENT LOOP</text>

  <g filter="url(#shadow)">
    <rect x="465" y="55" width="360" height="58" rx="7" fill="#c74634"/>
    <text x="645" y="91" class="group" text-anchor="middle">Human-in-the-loop controls</text>
    <path d="M645 113 V164 H560 V218" fill="none" stroke="#c74634" stroke-width="4" marker-end="url(#arrow-dark)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="55" width="360" height="58" rx="7" fill="#2f66bd"/>
    <text x="1080" y="91" class="group" text-anchor="middle">Observability and monitoring</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="125" width="255" height="148" rx="8" fill="#fff" stroke="#70886c" stroke-width="2"/>
    <rect x="50" y="125" width="255" height="48" rx="8" fill="#4f7b2f"/>
    <text x="178" y="157" class="group" text-anchor="middle">Domain context</text>
    <line x1="50" y1="221" x2="305" y2="221" stroke="#bbc5b9"/>
    <text x="178" y="204" class="label body mono" text-anchor="middle">AGENTS.md</text>
    <text x="178" y="254" class="label body mono" text-anchor="middle">SKILL.md</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="35" y="330" width="285" height="335" rx="8" fill="#fff" stroke="#7d6aae" stroke-width="2"/>
    <rect x="35" y="330" width="285" height="50" rx="8" fill="#6653a4"/>
    <text x="178" y="363" class="group" text-anchor="middle">Context engineering</text>
    <g class="label small" text-anchor="middle">
      <text x="178" y="420">Context-window utility</text>
      <text x="178" y="463">Context organization</text>
      <text x="178" y="506">Isolation and composition</text>
      <text x="178" y="549">Context retrieval</text>
      <text x="178" y="592">Context reduction</text>
      <text x="178" y="635">Context offloading</text>
    </g>
    <g stroke="#d4cdea">
      <line x1="35" y1="435" x2="320" y2="435"/>
      <line x1="35" y1="478" x2="320" y2="478"/>
      <line x1="35" y1="521" x2="320" y2="521"/>
      <line x1="35" y1="564" x2="320" y2="564"/>
      <line x1="35" y1="607" x2="320" y2="607"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="220" width="300" height="176" rx="18" fill="#eef7fb" stroke="#2d6573" stroke-width="3"/>
    <path d="M438 220 H702 Q720 220 720 238 V274 H420 V238 Q420 220 438 220" fill="#285e70"/>
    <text x="445" y="256" class="head">1. Assemble context</text>
    <text x="450" y="311" class="label body">instructions, state, memory</text>
    <text x="450" y="347" class="label body">tool outputs, relevant data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="968" y="232" width="285" height="145" rx="18" fill="#f3f6f7" stroke="#334e58" stroke-width="3"/>
    <path d="M986 232 H1235 Q1253 232 1253 250 V281 H968 V250 Q968 232 986 232" fill="#365864"/>
    <text x="993" y="266" class="head">2. Invoke LLM</text>
    <text x="1000" y="328" class="label body">Reason and decide</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="590" width="310" height="155" rx="18" fill="#f3f7f3" stroke="#3f654d" stroke-width="3"/>
    <path d="M738 590 H1012 Q1030 590 1030 608 V642 H720 V608 Q720 590 738 590" fill="#406b50"/>
    <text x="747" y="626" class="head">3. Observe and act</text>
    <text x="750" y="690" class="label body">respond, call tools,</text>
    <text x="750" y="724" class="label body">ask user for input</text>
  </g>

  <path d="M720 305 H968" class="dash"/>
  <path d="M1110 377 V530 Q1110 555 1085 555 H875 V590" class="dash"/>
  <path d="M720 668 H570 Q545 668 545 643 V396" class="dash"/>
  <g transform="translate(855 474) rotate(45)">
    <rect x="-42" y="-42" width="84" height="84" rx="7" fill="#d37a68"/>
  </g>
  <circle cx="855" cy="474" r="10" fill="#fff"/>
  <text x="855" y="544" class="label small" text-anchor="middle" font-style="italic">cyclical and iterative</text>

  <path d="M305 199 C360 199 365 252 420 252" class="dash"/>
  <path d="M320 420 C360 420 375 338 420 338" class="dash"/>
  <path d="M545 615 C470 615 420 645 320 645" class="dash"/>

  <g>
    <path d="M1470 355 V174 H720 V220" fill="none" stroke="#648d3b" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow-green)"/>
    <rect x="1417" y="137" width="108" height="44" rx="5" fill="#648d3b"/>
    <text x="1471" y="167" class="group" text-anchor="middle">READ</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="1470" cy="396" rx="48" ry="18" fill="#ef715a" stroke="#9d2f21" stroke-width="3"/>
    <rect x="1422" y="396" width="96" height="118" fill="#c74634" stroke="#9d2f21" stroke-width="3"/>
    <ellipse cx="1470" cy="514" rx="48" ry="18" fill="#a93224" stroke="#84251a" stroke-width="3"/>
    <ellipse cx="1470" cy="396" rx="48" ry="18" fill="#e86750" stroke="#9d2f21" stroke-width="3"/>
    <rect x="1378" y="548" width="184" height="48" rx="8" fill="#fff" stroke="#c74634" stroke-width="2"/>
    <text x="1470" y="579" class="label small" text-anchor="middle" font-weight="750">Oracle AI Database</text>
  </g>

  <g>
    <path d="M1030 660 H1470 V532" fill="none" stroke="#23747b" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/>
    <rect x="1409" y="635" width="122" height="44" rx="5" fill="#23747b"/>
    <text x="1470" y="665" class="group" text-anchor="middle">WRITE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1360" y="704" width="220" height="68" rx="8" fill="#bd7721"/>
    <text x="1470" y="746" class="group" text-anchor="middle">Sandbox</text>
    <rect x="1360" y="790" width="220" height="68" rx="8" fill="#bd7721"/>
    <text x="1470" y="832" class="group" text-anchor="middle">Tool calling</text>
  </g>
  <path d="M1030 695 C1170 695 1265 738 1360 738" class="dash"/>
  <path d="M1030 712 C1190 725 1255 824 1360 824" class="dash"/>
</svg>

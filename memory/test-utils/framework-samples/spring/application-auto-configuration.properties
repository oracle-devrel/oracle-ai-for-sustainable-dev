# Future Spring Boot starter sample.
# This is the shape an ojdbc-agent-memory-spring-boot-starter could expose after
# auto-configuration is contributed or published.
#
# With a starter, an application should only provide properties. The starter
# would create OracleAgentMemory when a DataSource is available and no user bean
# already exists.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/freepdb1
spring.datasource.username=scott
spring.datasource.password=tiger
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

ojdbc.agentmemory.enabled=true

ojdbc.agentmemory.schema.auto-create=true
ojdbc.agentmemory.schema.table-prefix=OAMJ_

ojdbc.agentmemory.embedding.provider=database
ojdbc.agentmemory.embedding.model=allminilm

ojdbc.agentmemory.llm.provider=ollama
ojdbc.agentmemory.llm.base-url=http://localhost:11434
ojdbc.agentmemory.llm.model=llama3.2:latest
ojdbc.agentmemory.llm.temperature=0.0

ojdbc.agentmemory.memory.extract-memories=true
